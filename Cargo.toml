[workspace]
resolver = "2"
members = [
    "crates/lean-rust",
    "crates/lean-rust-runtime",
    "crates/lean-rust-macros",
    "crates/lean-rust-build",
    "crates/cargo-lean-rust",
    "tests/difftest",
    "tests/public",
    "tests/embed",
    "tests/verify",
    "samples/todo-cli",
    "samples/word-count",
    "samples/roman-numerals",
    "samples/verified-rust",
    "samples/sorted-search",
    "samples/inventory",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/conao3/lean-rs"
readme = "README.md"
keywords = ["lean", "lean4", "verification", "theorem-prover", "codegen"]
categories = ["development-tools", "compilers"]
