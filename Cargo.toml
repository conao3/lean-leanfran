[workspace]
resolver = "2"
members = [
    "crates/lean-rust",
    "crates/lean-rust-runtime",
    "crates/lean-rust-macros",
    "crates/lean-rust-build",
    "crates/cargo-lean-rust",
    "tests/difftest",
    "tests/public",
    "tests/embed",
    "tests/verify",
    "samples/todo-cli",
    "samples/word-count",
    "samples/roman-numerals",
    "samples/verified-rust",
    "samples/sorted-search",
    "samples/inventory",
    "samples/generic-search",
    "samples/steps/01-functions",
    "samples/steps/02-theorems",
    "samples/steps/03-structures",
    "samples/steps/04-inductives",
    "samples/steps/05-collections",
    "samples/steps/06-imports",
    "samples/steps/07-io",
    "samples/steps/08-polymorphic",
    "samples/steps/09-lake-project",
    "samples/steps/10-ensures",
    "samples/steps/11-prop-specs",
    "samples/steps/12-requires",
    "samples/steps/13-refines",
    "samples/steps/14-loops",
    "samples/steps/15-structs-enums",
    "samples/steps/16-opaque",
    "samples/steps/17-generics",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/conao3/lean-rs"
readme = "README.md"
keywords = ["lean", "lean4", "verification", "theorem-prover", "codegen"]
categories = ["development-tools", "compilers"]
