[workspace]
resolver = "2"
members = [
    "crates/lean-rust",
    "crates/lean-rust-runtime",
    "crates/lean-rust-macros",
    "crates/lean-rust-build",
    "tests/difftest",
    "tests/public",
    "tests/embed",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/conao3/lean-rs"
