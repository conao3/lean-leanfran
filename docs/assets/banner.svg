<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="640" viewBox="0 0 2048 640" role="img" aria-labelledby="title desc">
  <title id="title">leanfran</title>
  <desc id="desc">Prove in Lean. Run in Rust, Python, TypeScript and Clojure.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#171d43"/>
      <stop offset="1" stop-color="#0c1028"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#171e31"/>
      <stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
  </defs>
  <rect width="2048" height="640" rx="24" fill="url(#background)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="80" y="280" fill="#ffffff" font-size="174" font-weight="750" letter-spacing="-9">leanfran</text>
    <text x="88" y="365" fill="#d3dcf5" font-size="39">Prove in Lean. Run in your language.</text>
    <text x="90" y="440" fill="#93a6d3" font-size="29">Rust · Python · TypeScript · Clojure</text>
    <rect x="1080" y="70" width="876" height="340" rx="22" fill="url(#panel)" stroke="#34456c" stroke-width="2"/>
    <rect x="1116" y="99" width="140" height="48" rx="10" fill="#243b69"/>
    <text x="1135" y="132" fill="#92b9ff" font-size="29" font-weight="650">Lean 4</text>
    <circle cx="1897" cy="124" r="21" fill="#153d3d"/>
    <path d="m1887 124 7 7 13-15" fill="none" stroke="#7de2bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="29" fill="#d3dcf5">
      <text x="1116" y="200">def double (n : Nat) : Nat := n + n</text>
      <text x="1116" y="260">theorem double_eq (n : Nat) :</text>
      <text x="1150" y="306">double n = 2 * n := by</text>
      <text x="1184" y="352" fill="#92b9ff">unfold double; omega</text>
    </g>
    <path d="M1518 411v39M1180 450h674M1180 450v27M1402 450v27M1624 450v27M1846 450v27" fill="none" stroke="#607eb5" stroke-width="3"/>
