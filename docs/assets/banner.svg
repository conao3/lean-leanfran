      <rect x="1302" y="477" width="202" height="66" rx="12" fill="#1b2c42" stroke="#577caa" stroke-width="2"/>
      <text x="1403" y="519" fill="#a4caff">Python</text>
      <rect x="1524" y="477" width="202" height="66" rx="12" fill="#172e4b" stroke="#477ab3" stroke-width="2"/>
