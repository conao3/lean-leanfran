name = "leanfran-go"
defaultTargets = ["leanfran-go"]

[[lean_lib]]
name = "LeanGo"

[[lean_exe]]
name = "leanfran-go"
root = "Main"
supportInterpreter = true

[[lean_lib]]
name = "LeanGoTest"

[[lean_exe]]
name = "oracle"
root = "LeanGoTest.OracleMain"

[[lean_exe]]
name = "oracle-io"
root = "LeanGoTest.IoMain"

[[lean_exe]]
name = "oracle-control-depth"
root = "LeanGoTest.ControlDepthMain"

[[lean_exe]]
name = "oracle-fuzz"
root = "LeanGoTest.FuzzMain"
