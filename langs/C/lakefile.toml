name = "leanfran-c"
version = "0.10.0"
defaultTargets = ["leanfran-c", "LeanCLib"]

[[lean_lib]]
name = "LeanC"
needs = ["support"]

[[input_dir]]
name = "support"
text = true

[[lean_exe]]
name = "leanfran-c"
root = "Main"
supportInterpreter = true

[[lean_lib]]
name = "LeanCLib"
srcDir = "lean"
globs = ["LeanCLib.+"]

[[lean_lib]]
name = "ModelOps"
srcDir = "tests/verify"
