name = "leanfran-c"
version = "0.11.1"
defaultTargets = ["leanfran-c", "LeanCLib"]

[[lean_lib]]
name = "LeanC"
needs = ["support", "jsonSupport"]

[[input_dir]]
name = "support"
text = true

[[input_dir]]
name = "jsonSupport"
path = "lean/LeanfranC"
text = true

[[lean_exe]]
name = "leanfran-c"
root = "Main"
supportInterpreter = true

[[lean_lib]]
name = "LeanCLib"
srcDir = "lean"
globs = ["LeanCLib.+"]

[[lean_lib]]
name = "LeanfranC"
srcDir = "lean"
globs = ["LeanfranC.+"]

[[lean_lib]]
name = "ModelOps"
srcDir = "tests/verify"
