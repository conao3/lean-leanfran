name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z)
        required: true
        type: string

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
    environment:
      name: crates.io
      url: https://crates.io/crates/lean-rust
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix develop -c cargo publish --workspace --dry-run
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - run: |
          version="${TAG#v}"
          for crate in lean-rust-runtime lean-rust-build lean-rust-macros lean-rust cargo-lean-rust; do
            if curl -sf -A "lean-rs publish (github.com/conao3/lean-rs)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io"
            else
              nix develop -c cargo publish -p "$crate"
            fi
          done
        env:
          TAG: ${{ inputs.tag }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
