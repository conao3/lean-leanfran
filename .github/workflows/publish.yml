name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust:
    name: Publish the crates to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment:
      name: crates.io
      url: https://crates.io/crates/lean-rust
    defaults:
      run:
        working-directory: Rust
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix develop -c cargo publish --workspace --dry-run
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - run: |
          version="${TAG#v}"
          for crate in lean-rust-runtime lean-rust-build lean-rust-macros lean-rust cargo-lean-rust; do
            if curl -sf -A "lean-leanfran publish (github.com/conao3/lean-leanfran)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io"
            else
              nix develop -c cargo publish -p "$crate"
            fi
          done
        env:
          TAG: ${{ inputs.tag }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  python:
    name: Publish lean-python to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/lean-python/
    defaults:
      run:
        working-directory: Python
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: cachix/install-nix-action@v31.11.3
      - run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" = "$TAG"
        env:
          TAG: ${{ inputs.tag }}
      - run: nix develop -c uv build
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: Python/dist/
          skip-existing: true

  typescript:
    name: Publish lean-ts to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/lean-ts
    defaults:
      run:
        working-directory: TypeScript
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: cachix/install-nix-action@v31.11.3
      - run: test "v$(jq -r .version package.json)" = "$TAG"
        env:
          TAG: ${{ inputs.tag }}
      - run: |
          version="${TAG#v}"
          if curl -sf "https://registry.npmjs.org/lean-ts/$version" > /dev/null; then
            echo "lean-ts $version is already on npm"
          else
            nix develop -c make pack
            nix develop -c npm publish --provenance
          fi
        env:
          TAG: ${{ inputs.tag }}

  clojure:
    name: Deploy lean-clj to Clojars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: clojars
    defaults:
      run:
        working-directory: Clojure
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: cachix/install-nix-action@v31.11.3
      - run: test "v$(sed -n 's/.*:version "\([0-9.]*\)".*/\1/p' deps.edn)" = "$TAG"
        env:
          TAG: ${{ inputs.tag }}
      - run: |
          version="${TAG#v}"
          if curl -sf "https://repo.clojars.org/io/github/conao3/lean-clj/$version/lean-clj-$version.pom" > /dev/null; then
            echo "io.github.conao3/lean-clj $version is already on Clojars"
          else
            nix develop --command make deploy
          fi
        env:
          TAG: ${{ inputs.tag }}
          CLOJARS_USERNAME: conao3
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
