name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency: release

jobs:
  version:
    name: Choose the next version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: next
        run: echo "version=$(maint/next-version.sh "$BUMP")" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.version_bump }}

  set:
    name: Write the version (${{ matrix.dir }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        dir: [Rust, Python, TypeScript, Clojure, PHP, Go, C]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - run: maint/set-version.sh "$VERSION" "$DIR"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DIR: ${{ matrix.dir }}
      - run: git diff --binary > "version-$DIR.patch"
        env:
          DIR: ${{ matrix.dir }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: version-patch-${{ matrix.dir }}
          path: version-${{ matrix.dir }}.patch

  check:
    name: make check (${{ matrix.dir }})
    needs: [version, set]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        dir: [Rust, Python, TypeScript, Clojure, PHP, Go, C]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: version-patch-*
          merge-multiple: true
      - run: maint/apply-version.sh "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - run: make check BACKENDS=${{ matrix.dir }}

  tag:
    name: Commit, tag and start the publish
    needs: [version, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: version-patch-*
          merge-multiple: true
      - run: maint/apply-version.sh "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release v$VERSION"
          maint/push-release.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
      - run: gh workflow run publish.yml -f tag="v$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
