name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency: release

jobs:
  version:
    name: Write the next version into the four backends
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - id: next
        run: echo "version=$(scripts/next-version.sh "$BUMP")" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.version_bump }}
      - run: scripts/set-version.sh "$VERSION"
        env:
          VERSION: ${{ steps.next.outputs.version }}
      - run: git diff --binary > version.patch
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: version-patch
          path: version.patch

  check:
    name: make check (${{ matrix.dir }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        dir: [Rust, Python, TypeScript, Clojure]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - uses: actions/download-artifact@v8.0.2
        with:
          name: version-patch
      - run: git apply version.patch && rm version.patch
      - run: nix develop -c make check
        working-directory: ${{ matrix.dir }}

  tag:
    name: Commit, tag and start the publish
    needs: [version, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: version-patch
      - run: git apply version.patch && rm version.patch
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin "HEAD:$BRANCH" "refs/tags/v$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
      - run: gh workflow run publish.yml -f tag="v$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
