name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: Rust
            build: false
          - dir: Python
            build: true
          - dir: TypeScript
            build: true
          - dir: Clojure
            build: true
          - dir: PHP
            build: true
          - dir: Go
            build: true
          - dir: C
            build: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - run: make check BACKENDS=${{ matrix.dir }}
      - if: matrix.build
        run: nix build ".#${BACKEND,,}"
        env:
          BACKEND: ${{ matrix.dir }}
  check-go-macos:
    name: make check (Go, macOS arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - run: nix build .#go
      - run: nix develop .#go -c make -k -C langs/Go check
