name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select CI backends
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backends: ${{ steps.select.outputs.backends }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - run: bash maint/test-ci-backends.sh
      - id: select
        shell: bash
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]] &&
             git rev-parse --verify HEAD^2 >/dev/null 2>&1 &&
             backends=$(git diff --name-only --no-renames -z HEAD^1 HEAD | bash maint/ci-backends.sh); then
            :
          else
            backends=$(bash maint/ci-backends.sh --all)
          fi
          echo "Selected backends: $backends"
          echo "backends=$backends" >> "$GITHUB_OUTPUT"

  check:
    name: make check (${{ matrix.dir }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_BACKEND: ${{ contains(fromJSON(needs.changes.outputs.backends), matrix.dir) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: Rust
            nix-shells: rust
          - dir: Python
          - dir: TypeScript
          - dir: Clojure
            maven: true
          - dir: PHP
            nix-shells: php php85
          - dir: Go
    steps:
      - uses: actions/checkout@v7.0.1
        if: env.RUN_BACKEND == 'true'
      - uses: cachix/install-nix-action@v32.0.0
        if: env.RUN_BACKEND == 'true'
      - if: env.RUN_BACKEND == 'true' && matrix.nix-shells
        id: nix-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: nix-store-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-keys: nix-store-${{ runner.os }}-${{ matrix.dir }}-
      - if: env.RUN_BACKEND == 'true' && matrix.nix-shells
        run: maint/ci-nix-cache.sh restore "$RUNNER_TEMP/nix-cache" $SHELLS
        env:
          SHELLS: ${{ matrix.nix-shells }}
      - if: env.RUN_BACKEND == 'true' && matrix.nix-shells && steps.nix-cache.outputs.cache-hit != 'true'
        run: maint/ci-nix-cache.sh save "$RUNNER_TEMP/nix-cache" $SHELLS
        env:
          SHELLS: ${{ matrix.nix-shells }}
      - if: env.RUN_BACKEND == 'true' && matrix.nix-shells && steps.nix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: ${{ steps.nix-cache.outputs.cache-primary-key }}
      - if: env.RUN_BACKEND == 'true' && matrix.maven
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: maven-${{ runner.os }}-${{ hashFiles('langs/Clojure/**/deps.edn') }}
          restore-keys: maven-${{ runner.os }}-
      - if: env.RUN_BACKEND == 'true'
        run: make check BACKENDS=${{ matrix.dir }}
  check-compiler:
    name: leanfran (all languages, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - run: nix build .#leanfran
      - run: maint/test-compiler.sh result/bin/leanfran
  check-c-linux-models:
    name: C Linux (models and packaging)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.backends), 'C')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - run: nix develop .#c -c make -C langs/C check-models
      - run: nix develop .#c -c maint/C/test-publish.sh
  check-c-linux-verification:
    name: C Linux (verification)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.backends), 'C')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - run: nix develop .#c -c make -C langs/C check-verify
  check-c-linux-integration:
    name: C Linux (integration)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.backends), 'C')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - run: nix develop .#c -c make -C langs/C check-integration
  check-c-linux:
    name: make check (C)
    needs: [changes, check-c-linux-models, check-c-linux-verification, check-c-linux-integration]
    if: ${{ !cancelled() && contains(fromJSON(needs.changes.outputs.backends), 'C') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$MODELS_RESULT" = success && test "$VERIFICATION_RESULT" = success && test "$INTEGRATION_RESULT" = success
        env:
          MODELS_RESULT: ${{ needs.check-c-linux-models.result }}
          VERIFICATION_RESULT: ${{ needs.check-c-linux-verification.result }}
          INTEGRATION_RESULT: ${{ needs.check-c-linux-integration.result }}
  check-go-macos:
    name: make check (Go, macOS arm64)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.backends), 'Go')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - run: nix develop .#go -c make -k -C langs/Go check
  check-c-macos-checks:
    name: C macOS arm64 (checks)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.backends), 'C')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - run: nix develop .#c -c make -C langs/C check VERIFY_TARGET=
  check-c-macos-verification:
    name: C macOS arm64 (verification)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.backends), 'C')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - run: nix develop .#c -c make -C langs/C check-verify
  check-c-macos:
    name: make check (C, macOS arm64)
    needs: [changes, check-c-macos-checks, check-c-macos-verification]
    if: ${{ !cancelled() && contains(fromJSON(needs.changes.outputs.backends), 'C') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$CHECKS_RESULT" = success && test "$VERIFICATION_RESULT" = success
        env:
          CHECKS_RESULT: ${{ needs.check-c-macos-checks.result }}
          VERIFICATION_RESULT: ${{ needs.check-c-macos-verification.result }}
