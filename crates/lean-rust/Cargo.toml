[package]
name = "lean-rust"
description = "Run Lean functions from Rust and verify Rust functions in Lean"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["check"]
check = ["dep:proptest"]

[dependencies]
lean-rust-macros = { path = "../lean-rust-macros", version = "0.3.0" }
lean-rust-runtime = { path = "../lean-rust-runtime", version = "0.3.0" }
proptest = { version = "1", optional = true }
