name = "step_10_ensures"
defaultTargets = ["LeanRustGen", "External", "ExternalTypes", "Proofs"]
packagesDir = "../../../../.lake-aeneas/packages"

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "c5eb4a28cef65e0aa27743105308243e535a2a2b"
subDir = "backends/lean"

[[lean_lib]]
name = "LeanRustGen"
globs = ["LeanRustGen.+"]

[[lean_lib]]
name = "External"

[[lean_lib]]
name = "ExternalTypes"

[[lean_lib]]
name = "Proofs"
globs = ["Proofs.+"]
