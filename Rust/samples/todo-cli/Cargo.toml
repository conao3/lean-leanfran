[package]
name = "todo-cli"
version = "0.1.0"
edition = "2021"
publish = false
include = ["src/**", "build.rs", ".leanfran/cache/**", "lean/**"]

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
leanfran = { path = "../../crates/leanfran" }
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
leanfran-build = { path = "../../crates/leanfran-build" }
