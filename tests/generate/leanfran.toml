[[generate]]
lang = "rust"
lake-dir = "."
out-dir = "out/rust"
path = "crate::generated"
modules = ["Shapes.*", "Report"]

[[generate]]
lang = "python"
lake-dir = "."
out-dir = "out/python"
path = "shapes.gen"
modules = ["Shapes", { name = "Shapes.Area", as = "area" }, { name = "Report", bind = { "Shapes" = "shapes.points" } }]

[[generate]]
lang = "go"
lake-dir = "."
out-dir = "out/go"
path = "example.com/shapes/gen"
modules = ["Shapes", "Shapes.Area", "Report"]

[generate.bind]
"Shapes.Area" = "example.com/shapes/area"
